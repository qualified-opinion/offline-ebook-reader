<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Ebook Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Offline Ebook Reader</h1>
    <input type="file" id="fileInput" accept=".epub,.pdf,.txt,.html" />
    <div id="reader">
      <p>Select a file to start reading.</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
